<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fool's Court — a card game of promises kept and broken</title>
<meta name="description" content="Four nobles compete for the monarch's ear. Send agents out on secret errands to pledge how many audiences you will win, and whoever fails hands the court to the Fool.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23d9a441'><path d='M50 6 L58 32 L58 60 L42 60 L42 32 Z'/><rect x='27' y='60' width='46' height='8' rx='2'/><rect x='45' y='68' width='10' height='18'/><circle cx='50' cy='90' r='7'/></g></svg>">
</head>
<body>

<header class="topbar">
  <h1>The Fool's Court</h1>
  <div class="topbar-meta" id="topbar-meta"></div>
  <nav class="topbar-actions">
    <button type="button" class="btn btn-quiet" id="open-rules">Rules</button>
    <label class="control toggle">
      <input type="checkbox" id="whispers-toggle" checked>
      Whispers
    </label>
    <label class="control">
      Pace
      <select id="speed">
        <option value="1100">Stately</option>
        <option value="700" selected>Measured</option>
        <option value="320">Brisk</option>
      </select>
    </label>
    <button type="button" class="btn btn-quiet" id="new-game">New season</button>
  </nav>
</header>

<div class="layout">

  <main class="board">
    <div class="felt" id="felt">
      <div class="seat seat-north" id="seat-2"></div>
      <div class="seat seat-west" id="seat-1"></div>
      <div class="seat seat-east" id="seat-3"></div>

      <div class="center">
        <div class="trump-medallion" id="trump-medallion"></div>
        <div class="trick" id="trick"></div>
        <div class="trick-note" id="trick-note"></div>
      </div>
    </div>

    <div class="you">
      <div class="seat seat-south" id="seat-0"></div>
      <div class="hand-block">
        <p class="prompt" id="prompt"></p>
        <div class="hand" id="hand"></div>
        <div class="hand-actions" id="hand-actions"></div>
      </div>
    </div>
  </main>

  <aside class="panel">
    <section class="card-box whisper-box" id="whisper-box"></section>

    <section class="card-box">
      <h2>Favour <span class="target" id="target-note"></span></h2>
      <table class="scoreboard" id="scoreboard"></table>
    </section>

    <section class="card-box">
      <h2>Who holds sway</h2>
      <ul class="trump-key" id="trump-key">
        <li data-made="0"><b>0</b> <span class="arrow">&rarr;</span> <span class="slot" data-agent="C"></span></li>
        <li data-made="1"><b>1</b> <span class="arrow">&rarr;</span> <span class="slot" data-agent="D"></span></li>
        <li data-made="2"><b>2</b> <span class="arrow">&rarr;</span> <span class="slot" data-agent="H"></span></li>
        <li data-made="3"><b>3</b> <span class="arrow">&rarr;</span> <span class="slot" data-agent="S"></span></li>
        <li data-made="4"><b>4</b> <span class="arrow">&rarr;</span> <b>No Sway</b></li>
      </ul>
      <p class="fine">Nobles who kept their pledge on the night before.</p>
    </section>

    <details class="card-box" id="history-box">
      <summary><h2>Court record</h2></summary>
      <div id="history"></div>
    </details>
  </aside>

</div>


<!-- ======================================================================
     The rulebook. Opened from the top bar; the Whisper table inside is
     filled in from js/whispers.js so it cannot drift from the game.
     ====================================================================== -->
<div class="rulebook" id="rulebook" hidden>
  <div class="rulebook-shell">

    <header class="rulebook-head">
      <div>
        <h2>The Fool's Court</h2>
        <p class="rulebook-sub">A trick-taking game of promises, for four players</p>
      </div>
      <button type="button" class="btn btn-quiet" id="close-rules">Close</button>
    </header>

    <div class="rulebook-body">
      <nav class="rulebook-nav" id="rulebook-nav"></nav>

      <article class="rulebook-text" id="rulebook-text"></article>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/cards.js"></script>
<script src="js/rules.js"></script>
<script src="js/whispers.js"></script>
<script src="js/rulebook.js"></script>
<script src="js/ai.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
